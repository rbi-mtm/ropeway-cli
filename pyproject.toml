[project]
name = "ropeway-cli"
version = "0.1.0"
description = "Remote file operations over SSH via a ropeway metaphor — a CLI tool for transferring, syncing, and managing remote files"
readme = "README.md"
authors = [
    { name = "bernik86", email = "44434852+bernik86@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.0",
    "fabric>=3.2.3",
    "rich-click>=1.9.7",
]

[project.optional-dependencies]
dev = [
    "isort",
    "black",
    "pylint",
    "pylint-venv",
    "pycodestyle",
    "pyflakes",
    "mypy",
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/ropeway_cli"]
relative_files = true
omit = ["main.py", "__init__.py"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95

[project.scripts]
ropeway-cli = "ropeway_cli.main:main"

[tool.isort]
profile = "black"
multi_line_output = 7
force_single_line = true

[tool.black]
line-length = 100
target-version = ['py312']

[tool.pylint.format]
max-line-length = "100"

[pycodestyle]
max-line-length = 100

[[tool.mypy.overrides]]
module = "fabric"
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
